[project]
name = "medrageval"
version = "0.1.0"
description = "Build RAG evaluation datasets from medical PDF documents"
requires-python = ">=3.13,<3.14"
dependencies = [
    # PDF -> Markdown. pymupdf4llm refuses to import unless pymupdf matches its
    # version exactly, and the layout model decides table/heading output, so pin all three.
    "pymupdf==2.0",
    "pymupdf4llm==2.0",
    "pymupdf-layout==2.0",
    # OCR for scanned pages. Required: Tesseract output was clearly worse on the
    # scanned expert statements, and the parser refuses to fall back to it.
    "rapidocr==3.10.0",
    "onnxruntime==1.31.1",
    "pyyaml>=6.0",
    # Question generation calls OpenRouter through the OpenAI chat-completions SDK;
    # python-dotenv loads OPENROUTER_API_KEY from a gitignored .env.
    "openai>=3.41.0",
    "python-dotenv>=1.2.4",
    # Embedding vectors in the RAG application, and the dense search of its in-memory store.
    "numpy>=2.0",
    "docling>=2.40",
    "sentence-transformers>=3.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
medrageval = "medrageval.cli:main"
medrag = "medrag.cli:main"

[tool.pytest.ini_options]
# Regression tests parse the real PDFs (minutes on first run): uv run pytest -m regression
markers = ["regression: end-to-end checks on the real PDFs in data/raw"]
addopts = "-m 'not regression'"
# Emitted by PyMuPDF's SWIG bindings on import; not actionable here.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medrageval", "src/medrag"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
