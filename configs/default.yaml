# Pipeline settings. Values here change the generated dataset, so treat edits
# like code changes and re-run the affected stages.

parse:
  # html keeps merged cells (rowspan/colspan). Markdown tables put a merged
  # value into a single row, e.g. a total spanning 9 rows landed on row 5.
  table_output: html
  ocr:
    # OCR runs only on pages the layout model detects as image-only.
    enabled: true
    # Only rapidocr is supported; the parser errors out instead of falling back.
    engine: rapidocr
    # 150 dpi dropped whole sentences on the scanned statements; 300 did not.
    dpi: 300

clean:
  # A running header/footer repeats on nearby pages AND sits in the top/bottom
  # margin. Requiring both keeps repeated body notes ("Source: data on file")
  # and form-template headings that recur once per document ("About you").
  header_footer:
    margin: 0.25         # share of page height counted as top or bottom margin
    min_pages: 3         # must repeat on at least this many pages...
    max_gap: 3           # ...each at most this many pages after the previous one
    min_in_margin: 0.8   # and be in the margin on at least this share of repeats
    fuzzy_ratio: 0.85    # similarity for OCR'd copies of a known header/footer

segment:
  # A page starts a new document when its signal weights sum to the threshold.
  # Only a page-number reset is decisive alone; weaker signals must agree.
  use_outline: true      # PDF bookmarks, when present
  weights:
    page_reset: 2
    title_page: 1
    footer_change: 1
    outline: 1
  threshold: 2
  # Below this share of numbered pages, page resets cannot fire, so a title
  # page alone starts a document.
  min_numbered_pages: 0.5

generate:
  # The LLM. OpenRouter speaks the OpenAI chat-completions API, so any chat
  # model id listed on openrouter.ai works. The key is read from
  # OPENROUTER_API_KEY, or from a gitignored .env (see .env.example).
  model: openai/gpt-6-luna
  judge_model: null             # null: the judge uses the same model
  base_url: https://openrouter.ai/api/v1
  # Generation samples (varied phrasing across items). Reproducibility comes
  # from the seed (which evidence is picked) and the response cache, not from
  # temperature 0. The judge is deterministic so verdicts do not drift.
  temperature: 0.75
  judge_temperature: 0.0
  max_tokens: 2000              # 1200 truncated multi-hop items that quote two long rows
  max_workers: 6                # smoke run: 78 calls in 182 s at 6 workers, no rate-limit errors
  # Responses are cached by (model, temperature, messages); a rerun with the
  # same config makes no calls and writes an identical dataset.
  cache_dir: data/cache/llm
  seed: 20251030
  # Candidates tried per accepted item before a type gives up; below
  # min_share_of_target the run fails after writing what it has. Smoke runs
  # accepted about half of the single-excerpt candidates, but one in four
  # multi-hop ones (the judge rejects questions the value table answers alone;
  # since the third smoke run the selector keeps only pairs whose value
  # passage holds a rival) and one in five "not covered" questions (the
  # bundle usually does answer).
  attempts_per_item:
    default: 4
    multihop: 8
    crossdoc: 6
    unanswerable: 8
  # A rejected item goes back to the generator once, in the same conversation,
  # with each failed check, the judge's issues and what a single excerpt
  # answered, and the rewrite is checked again in full. Most rejections are
  # wording, not evidence: the first smoke run lost 10 of 24 generations to
  # long keys, quotes not found, an echoed quote and a key in the question,
  # discarding evidence that could carry an item (multi-hop pairs are scarce:
  # 23 trial bridges in TA1063). TRIAD does the same with its reviewer's reason.
  # Not rewritten: a skip, bad JSON, an attribution claim that is too
  # generic or restated by another party, or a pair of excerpts one of which
  # answers alone (the evidence's fault: no multi-hop rewrite ever fixed it).
  # Each item keeps its rejected first
  # version under `first_attempt`; the report counts rewrites per type.
  rewrite_rejected: true
  min_share_of_target: 0.5
  abort_after_consecutive_failures: 5   # five bad calls in a row means a wrong key or model

  # Items per type; the sum is the dataset size (150). Every item is built
  # from facts of the fact sheet (`medrageval extract`), drawn across schema
  # groups in proportion to their weights.
  # Paired types are set by what a bundle offers. TA1063 has 20 schema bridges,
  # and only a handful of unredacted figures on which two documents disagree
  # about the same arm and subject: 4,749 same-subject cross-document pairs
  # are redacted, and the rest are copies. document2 has 12.
  targets:
    factual: 26
    numerical: 26
    comparative: 20
    multihop: 10
    crossdoc: 4
    attribution: 20
    summary: 18          # open questions scored on keypoints, one per fact
    unanswerable: 26     # half redacted values, half near misses the documents do not cover

  limits:
    # Tables above this are split into row groups (table p90 is ~4300 chars;
    # expert statement forms are a single 14-19k char table each). A row group
    # keeps a form's "question | answer" pair together.
    max_table_chars: 4000
    row_group_chars: 1200
    max_paragraph_chars: 2500    # longer paragraphs are searchable but not used as evidence
    max_per_section: 2           # items drawn from one section, for coverage
    quote_tokens: [3, 80]        # a short table row ("CAPItello-291 | Strong | Weak") is 4 tokens
    question_words: [8, 45]       # multi-hop questions carry two descriptions; 40 cut good ones in the smoke run
    answer_max_chars: 400        # cross-document answers report two documents' positions; summaries have their own limit
    # OCR text carries glyph errors that end up in questions and answer keys
    # ("<65 yéárs", "Capivas ertib" in TA1063's Figure 10, 11 of 256 tables
    # and 14 of 1432 paragraphs are OCR). OCR units stay searchable.
    allow_ocr: false
  dedupe_jaccard: 0.7            # token-set overlap above which two questions are the same
  # Before each excerpt the generator sees the passages that precede it in its
  # section, read-only. On its own an excerpt can start mid-argument: in the
  # 31 Oct smoke run, factual-001 called the company's NMA "the EAG's" because
  # its paragraph ("The results also showed ...") did not say whose analysis
  # it was, and comparative-002 left out the trial its table's title named.
  context:
    units: 2
    max_chars: 700

  # Elements that must never become evidence or search hits. Counts are for
  # TA1063 / document2: reference lists 227 / 303 elements, elements under 25
  # chars 84 / 54 (labels and page fragments), figures (their text is OCR'd
  # chart axes), tables of contents stored as tables with dot leaders.
  noise:
    min_chars: 25
    section_title_patterns:
      - '^references\b'
      - '^(list of )?(tables|figures)\b'
      - '^(table of )?contents\b'
      - '\babbreviations\b'
      - '^glossary\b'
    text_patterns:
      - '\.{6,}'
      - 'all rights reserved'
      - '^©'
      - '^file name \|'
      - '^thank you for (your time|taking)'
      - '^please (complete|underline|return|note that this)'
      - '^you are asked to'
      - 'committed to meeting the requirements of copyright'
    # Form text: a paragraph that this many documents of one role repeat word
    # for word is the form's instructions, not an answer. TA1063: 85 more
    # elements, 44 distinct texts, all instructions or form titles of the
    # patient organisation, patient expert and clinical expert forms ("You do
    # not have to answer every question ..."). The text patterns above missed
    # them, and two were among the first 22 factual candidates of a full run.
    template_min_docs: 2

  # Document roles, scored on a document's headings, running text and first
  # 30 elements (TA1063's EAG report has no "EAG" heading; it is identified by
  # "Rider on responsibility for report"). A document with no hit is "other";
  # one with at most cover_max_units units is "cover". `override` maps doc_id
  # to role for a PDF the patterns get wrong.
  roles:
    cover_max_units: 30
    patterns:
      company_submission: ['\bDocument B\b', 'Company evidence submission']
      patient_summary: ['Summary of Information for Patients']
      clarification: ['Clarification questions']
      patient_org: ['Patient organisation submission']
      professional_org: ['Professional organisation submission']
      clinical_expert: ['Clinical expert statement']
      patient_expert: ['Patient expert statement']
      eag_report: ['External Assessment Group', 'Evidence Review Group', 'Rider on responsibility for report', '\bEAG report\b', '\bERG report\b']
      factual_accuracy: ['factual accuracy check', 'Description of problem']
      guidance: ['draft guidance', 'final appraisal document', 'appraisal consultation document']
      cover: ['^Committee Papers$']
    labels:
      company_submission: Company evidence submission
      patient_summary: Summary of information for patients
      clarification: Clarification questions and company responses
      patient_org: Patient organisation submission
      professional_org: Professional organisation submission
      clinical_expert: Clinical expert statement
      patient_expert: Patient expert statement
      eag_report: EAG report
      factual_accuracy: Factual accuracy check
      guidance: Committee guidance
      cover: Cover pages
      other: Document
    override: {}
    # How a question names a document: when two facts differ only in their
    # document (the clarification response reprints the submission's
    # goodness-of-fit table with new values), naming it tells them apart.
    mention:
      company_submission: company submission
      patient_summary: summary for patients
      clarification: clarification
      eag_report: EAG
      factual_accuracy: factual accuracy check
      guidance: committee

  # Two quotes from different documents with more token overlap than this are
  # copies, not two accounts (the EAG quotes the company verbatim).
  cross_doc_max_overlap: 0.8

  comparative:
    # Values that differ by less than this share of the larger are not worth
    # comparing: v14 asked which of 3.25 and 3.26 life years was higher.
    min_relative_difference: 0.10
    # Two counts both below this (integers, not percentages, medians or costs)
    # are no finding: the fresh smoke run compared 1 pleural-effusion SAE with 0.
    min_count: 5
    # Two facts of one slot are compared only when they differ in one of these: the same measure in two arms,
    # data cuts, populations or scenarios. Not item, event or measure: two different things.
    comparable_qualifiers: [arm, population, data_cut, timepoint, scenario, analysis, price, comparator, technology, health_state, trial, region]
    direction_words: [higher, lower, greater, less, longer, shorter, more, fewer, larger, smaller, better, worse, increase, increased, decrease, decreased, exceed, exceeds]

  attribution:
    # Canonical answer label -> aliases accepted when scoring. Speakers with no
    # document of their own (the committee) are still found through stance sentences.
    speakers:
      the company: [company, manufacturer, applicant, sponsor]
      the EAG: [EAG, ERG, External Assessment Group, Evidence Review Group, assessment group, review group]
      the clinical experts: [clinical expert, clinical experts, clinicians, clinical advisers]
      the patient experts: [patient expert, patient experts]
      the patient organisations: [patient organisation, patient organisations, patient group]
      the professional organisations: [professional organisation, professional organisations]
      the committee: [committee, appraisal committee]
    role_speakers:
      company_submission: the company
      patient_summary: the company
      clarification: the company
      factual_accuracy: the company
      eag_report: the EAG
      clinical_expert: the clinical experts
      patient_expert: the patient experts
      patient_org: the patient organisations
      professional_org: the professional organisations
      guidance: the committee
    # Experts and organisations speak for themselves only in their own
    # documents. Elsewhere their view is relayed by a party that holds it too:
    # "UK clinical experts therefore expect that capivasertib ... will be used
    # in patients who have previously received CDK4/6 inhibitor" is in the
    # company's lay summary, and the company says the same in Document B and
    # at clarification, so "who" had two answers. The only such stance in TA1063.
    own_voice_only: [the clinical experts, the patient experts, the patient organisations, the professional organisations]
    max_share_per_speaker: 0.5
    # Exclusivity: a claim restated in a document with a different role is not
    # attributable. Rare tokens are those in at most rare_df_max of all units;
    # at 0.01 / 3 tokens, stances like "the partitioned survival model approach
    # is appropriate" had no rare token at all and were dropped as generic.
    rare_df_max: 0.03
    min_rare_tokens: 2
    restated_containment: 0.7

  unanswerable:
    top_k: 6                     # BM25 hits per question shown to the coverage check (one call per anchor)
    neighbours: 4                # same-section units shown to the generator as off limits and to the check
    questions_per_anchor: 3
    # A redacted value may be printed elsewhere (TA1063 Table 14 redacts body
    # surface area; Table 42 gives 1.82 / 1.70). A redacted line is not used
    # when its rare words (in at most stated_rare_df_max of units: "surface",
    # "male", not "capivasertib") all reappear with a number on a short line
    # (a table row or one sentence) of a top BM25 hit. Matching any words on
    # a whole paragraph skipped 32 candidates in TA1063, nearly all wrongly.
    stated_top_k: 5
    stated_rare_df_max: 0.03
    stated_max_tokens: 40
    # "partly" = a passage gives a closely related fact but not the one asked:
    # exactly the near miss a good unanswerable question is (the bundle gives
    # DCO1, the question asks for DCO2). An answer that follows from the
    # passages is "yes" in the check's own definition, which is what the FAKTION
    # "which country" question of the first smoke run was. Rejecting "partly"
    # left only questions unrelated to anything in the bundle: the 31 Oct run
    # rejected "which spreadsheet version" and kept "which operating system
    # ran the model". The verdict is stored in the item's `search` field.
    accept_partly: true

  judge:
    max_chars_per_unit: 2500
  # The judge pass costs a call per item. It runs on every answerable type:
  # besides support, it checks that a question is realistic (one a clinician,
  # health economist or committee member would ask, not one about a table's
  # layout), which no programmatic check can.
  # Multi-hop through a `qualifier` link describes a thing by a fact's value
  # ("the comparator the company ruled out because of TA239"). The description
  # counts only by its identifiers and its words rare in the bundle (in at
  # most rare_df_max of units): "is a relevant comparator" describes nothing.
  # Fewer than min_description_tokens, or half of them shared with another
  # thing's description, and the fact is not a bridge.
  multihop:
    rare_df_max: 0.03
    min_description_tokens: 2

  judge_types: [factual, numerical, comparative, multihop, crossdoc, attribution, summary]
  # After the judge passes them, these items go back to the judge model once
  # per excerpt, with that excerpt alone, and are rejected when its answer
  # holds every answer key. The judge sees both excerpts at once and has to
  # imagine one away: in the 31 Oct smoke run and in v11 it called the value
  # excerpt insufficient for items that excerpt answered (FAKTION as Table 15's
  # only UK row; a >=5% threshold that held for every trial). TRIAD's data
  # shows the same gap: of the multi-hop items its all-chunks review accepted,
  # 15% (HotPot, 86 of 568) and 11% (MuSiQue, 59 of 537) were answerable from
  # one chunk by its per-chunk check. Two short calls per item that gets this far.
  # Cross-document items too: in v14 the judge said one excerpt answered
  # crossdoc-004 alone and it was kept, because only multi-hop was checked.
  # The alone check also asks by which words of the passage the model told
  # the items apart; for a multi-hop item its answer counts only when those
  # words are in the passage and belong to the bridge's description. A model
  # that picks alpelisib's row because it knows alpelisib is the PIK3CA drug
  # has not answered from the passage.
  alone_check_types: [multihop, crossdoc]

  summary:
    min_facts: 3                 # fewer is a factual question
    max_facts: 6                 # more and the answer is a list, not a summary
    answer_max_chars: 900

  validate:
    # A question must stand on its own: no pointing at the excerpt.
    # ... and no document ids, which only the generator sees ("In the d04 deterministic analysis", a v11 smoke-run question).
    deictic_patterns: ['\b(this|that|these|those) (table|figure|excerpt|passage|document|section|paragraph|study|trial|row|text)\b', '\b(above|below|the following)\b', '\baccording to the (excerpt|passage|text)\b', '\bd\d{2}\b']
    # A question is a copy of its quote when more than max_question_overlap
    # of its content words (numbers left out) are in the quote AND at least
    # echo_min_shared words are. Share alone cannot tell copying from naming:
    # "What was the company's base-case ICER for capivasertib plus
    # fulvestrant versus everolimus plus exemestane?" shares 8 of 8 words
    # and is the right question. Smoke run: 0.36-0.48 for questions in their
    # own words, 0.75-0.89 for attribution (exempt: it states the claim).
    # The share is recorded on every item as validation.metrics.question_overlap.
    # Quotes that are the table's caption are left out of the comparison: the
    # second smoke run rejected a sound Table 16 item at 0.84 because the
    # question repeated the caption it had quoted, as rule 2 asks.
    max_question_overlap: 0.7
    echo_min_shared: 10
    # An answer key is a value, a name or a short phrase, counted in words:
    # "NHS reference costs 2021-22" is four (two sound items were lost when
    # the year counted as two tokens). The smoke run's one long key, "latest
    # NHS reference costs (202122)", copied a parse defect and would have
    # failed a correct answer.
    max_key_tokens: 4
    # Questions about the layout instead of the subject: v14 asked about
    # "Table 37", "Capivasertib + fulvestrant (N=155)" and "the Capivasertib +
    # fulvestrant row". Users do not know table numbers.
    # Two questions glued with "and" (v14's crossdoc-001; the first fact-sheet
    # smoke run's "what tool and estimate", "what assumption ..., and how did
    # it affect"): two lookups, not one fact. Comparative, cross-document and
    # summary items combine facts by design and are exempt.
    single_ask_types: [factual, numerical, multihop, attribution, unanswerable]
    compound_patterns: ['\b(and|or) (what|which|how|who|when|why|where|whether)\b', ',\s*and (did|does|do|was|were|is|are|has|had)\b']
    banned_patterns: ['\b(table|figure|fig\.)\s*\d', '\(N\s*=\s*\d', '\brows?\b', '\bcolumns?\b']
    # Keys that a wrong answer contains as easily as a right one (v14 had
    # '0', 'Weak' and 'plausible'). Bare one- or two-digit numbers are
    # rejected too. Attribution keys (the speaker) are exempt.
    generic_keys: ['yes', 'no', 'none', 'weak', 'strong', 'moderate', 'high', 'low', 'plausible', 'appropriate', 'inappropriate', 'unclear', 'reasonable', 'increased', 'decreased', 'similar']   # quoted: YAML reads bare yes/no as booleans

# Fact sheet (`medrageval extract`): the verified facts that question
# generation is built on, as RAGEval builds its questions from a config of key
# facts. The schema says which facts matter for the document family. The LLM
# reads them out of batches of passages, and every fact is checked against a
# verbatim quote before it is kept.
facts:
  schema: configs/schema/nice_sta.yaml
  model: null                   # null: generate.model
  temperature: 0.0              # extraction is reading, not writing: deterministic
  max_tokens: 6000              # 25 facts with quotes and qualifiers run to ~4,500 tokens
  max_workers: 6
  batch:
    # Per group and document: units whose section path matches the group, then
    # the best keyword matches, up to max_units, packed into batches of
    # max_batch_chars. Longer batches made the model skip facts late in them.
    max_units: 60
    bm25_top_k: 40
    max_batch_chars: 12000
    max_unit_chars: 2500
  max_facts_per_batch: 25
  quote_tokens: [3, 80]         # a table row may be three tokens ("Total LY | 3.25 | 2.41")
  max_value_chars: 300
  min_grounding_tokens: 2       # a text value or stance shares this many content words with its quote
  # Two text facts of one slot differ when their content words overlap less than this.
  text_conflict_jaccard: 0.5
  # Copies in other documents (the EAG reprints the company's tables): every
  # value number and min_shared_rare rare words of the quote, or for text
  # facts text_containment of the quote's rare words.
  also_in:
    top_k: 8
    rare_df_max: 0.03
    min_shared_rare: 3
    text_containment: 0.7
  # The slot naming who wrote a stakeholder document; its value becomes the
  # speaker of the document's other facts.
  respondent_slot: stakeholder_views.respondent
  abort_after_consecutive_failures: 5
  # `medrageval schema draft`: what the LLM sees per document role.
  draft:
    max_titles_per_role: 120
    samples_per_role: 3
    sample_chars: 1200
