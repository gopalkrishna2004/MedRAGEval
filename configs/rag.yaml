# The RAG application under evaluation (Part 2). Independent of the benchmark
# pipeline: it parses the PDF itself, chunks its own way, and keeps its chunks
# and vectors in Postgres. The benchmark only shares the PDF with it.

pdf: data/raw/source_document.pdf
# One phrase naming what the documents are about, used in the answer prompt.
topic: the NICE single technology appraisal of capivasertib with fulvestrant for advanced breast cancer
cache_dir: data/rag/cache            # Docling output (JSON, keyed on PDF hash), chunk dumps

docling:
  ocr: true                          # RapidOCR on bitmap regions (the scanned patient and expert statements)
  table_structure: true              # cell-level table structure, so tables can be kept intact and split by row
  cell_matching: true

chunking:
  # Prose: elements under one heading are packed to target_tokens and never
  # past max_tokens; a long paragraph is cut at sentence ends. One sentence of
  # the previous chunk is repeated at the start of the next (overlap).
  # Tables: one chunk per table with its caption and the notes under it; past
  # max_table_tokens the rows are split with the header row repeated.
  # Every chunk starts with "document title | heading path | pages".
  target_tokens: 400
  max_tokens: 512
  overlap_sentences: 1
  max_table_tokens: 1500
  min_body_chars: 15                 # drop stray fragments (a lone page number, an empty cell)
  tokenizer: BAAI/bge-m3             # token counts follow the embedding model; null: ~4 chars per token

embedding:
  provider: local                    # local (sentence-transformers) | openai (any /v1/embeddings server)
  model: BAAI/bge-m3                 # 1024 dims, 8k tokens: a long table chunk is embedded whole
  device: auto                       # auto | mps | cuda | cpu
  batch_size: 16
  query_prefix: ""                   # bge-m3 needs none; e5-style models want "query: "
  base_url: http://localhost:8001/v1 # openai provider only
  api_key_env: EMBED_API_KEY
  dim: 1024

store:
  backend: postgres                  # postgres | memory (numpy, for tests and machines without Postgres)
  dsn: postgresql://localhost:5433/medrag
  dsn_env: MEDRAG_DSN                # overrides dsn when set

retrieval:
  mode: hybrid                       # bm25 | dense | hybrid
  top_k: 6                           # passages shown to the model
  candidates: 30                     # per retriever before fusion, and the width of the fused pool the reranker sees
  rrf_k: 60                          # reciprocal rank fusion constant
  rerank: true                       # cross-encoder over the fused candidates
  rerank_model: BAAI/bge-reranker-v2-m3
  rerank_candidates: 30
  max_context_chars: 12000           # ~3.5k tokens of passages

  # Settings for the ways a bundle of committee papers defeats plain retrieval.
  # All off here, so this file is the baseline; an ablation turns them on with
  # `medrageval eval ... --set retrieval.<key>=<value>`.
  #
  # Every chunk is about the same drug, so dense similarity tells sections
  # apart poorly: on the first 142-item run its top 30 held the evidence for
  # 53% of questions against BM25's 69%, and the fused order was below BM25
  # alone at six passages. A weight under 1 keeps dense's own finds without
  # letting its tail outvote a strong lexical match.
  rrf_weights: {bm25: 1.0, dense: 1.0}
  # A question that names a party ("the EAG report", "the company submission",
  # "in its clarification response") wants that document: 52 of 116 answerable
  # questions named one and 46 of those had all their evidence in it. Chunks of
  # the matching document have their fused score raised by hint_boost (0.5 =
  # half as much again). A boost, not a filter: the party is sometimes quoted
  # in another document (the EAG report quotes the company).
  hint_boost: 0.0
  document_hints:                    # query: pattern in the question; title: pattern in the chunk's document title
    - {query: '\bEAG\b|assessment group', title: 'EAG Report'}
    - {query: "company('s)? (evidence )?submission|\\bDocument B\\b", title: 'Document B'}
    - {query: 'clarification', title: 'Clarification'}
    - {query: 'patient organisation', title: 'Patient organisation|Breast Cancer Now|Make 2nds|METUPUK'}
    - {query: 'summary (of information )?for patients|lay summary', title: '\bSIP\b'}
    - {query: 'clinical expert', title: 'Clinical expert statement'}
    - {query: 'patient expert', title: 'Patient expert statement'}
    - {query: 'factual accuracy', title: 'FAC response'}
  # An overview question is answered by several adjacent chunks of one section,
  # of which retrieval finds one or two (summary items: evidence shown for 44%,
  # all of it for 11%). Each shown chunk brings the chunks within `neighbours`
  # positions of it under the same heading, after the ranked passages, up to
  # max_passages in all; raise max_context_chars with it (the reader has an
  # 8k window: 20000 chars is about 5.5k tokens of passages).
  neighbours: 0
  max_passages: 12
  # A question that describes a thing instead of naming it ("the comparator the
  # company considers relevant for PIK3CA-mutated disease") finds the passage
  # about the thing, not the one with the figure (multi-hop items: 0 of 10 on
  # the first run). With rewrite on, the first pass's top `passages` go to the
  # answering model, which restates the question up to max_queries ways with
  # the names filled in and the documents' own terms; their rankings are fused
  # with the original's at `weight`. One extra model call per question, cached.
  rewrite:
    enabled: false
    max_queries: 2
    passages: 4
    snippet_chars: 500
    weight: 0.7

llm:
  # vLLM's OpenAI-compatible server on the GPU machine: `vllm serve Qwen/Qwen2.5-3B-Instruct --port 8003`
  model: Qwen/Qwen2.5-3B-Instruct
  base_url: http://localhost:8003/v1
  base_url_env: VLLM_BASE_URL       # overrides base_url when set; a remote server's address stays in .env
  api_key_env: VLLM_API_KEY          # read when the server runs with --api-key; "EMPTY" otherwise
  temperature: 0.0
  max_tokens: 512
  context_window: 8192
  timeout: 300
  max_workers: 4
  cache_dir: data/cache/llm          # answers cached by (model, temperature, messages)

demo:
  # `medrag serve`: the evaluation run the page shows, and a reader that fails in
  # front of an audience within a minute rather than after 20 of retries.
  run: data/runs/ta1063
  llm_timeout: 60
  llm_max_retries: 0
  examples:                          # each checked live against its cited PDF page; rerun after a retrieval or prompt change
    - At 18 months, how did the overall survival rate in the PI3K/AKT pathway-altered population compare between capivasertib plus fulvestrant and placebo plus fulvestrant?
    - In CAPItello-291, what were the hazard ratio and 95% confidence interval for overall survival with capivasertib plus fulvestrant versus placebo plus fulvestrant in the PI3K/AKT pathway-altered population?
    - Among the ITT population in FAKTION, how many patients experienced fatigue of any grade with capivasertib plus fulvestrant?
    - What was the company's base-case ICER for capivasertib plus fulvestrant versus everolimus plus exemestane?
    - What is the recommended dose of capivasertib for children under 12?
